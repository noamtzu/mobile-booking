name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Shared schemas
        run: npm test -w @booking/shared
      - name: API against Postgres 17
        run: npm test -w @booking/api
        env:
          TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test
      - name: Mobile components
        run: npm test -w @booking/mobile -- --ci

  web-export:
    name: Expo web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/dist
          retention-days: 7
